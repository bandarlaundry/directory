<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Laundry Directory — Cari Laundry & Cleaning Terdekat</title>
  <meta name="description" content="Temukan laundry, cuci sepatu, home cleaning, cuci sofa, cuci karpet, dan berbagai jasa cleaning berdasarkan lokasi Anda.">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>

  <header class="app-header">
    <div class="brand">
      <h1><a href="/">Laundry Directory V1.0</a></h1>
      <p>Temukan laundry & jasa cleaning terdekat.</p>
    </div>
    <a href="./admin.html" class="btn btn-secondary">🛠️ Admin</a>
  </header>

  <section class="controls-section">
    <div class="search-wrapper">
      <input type="text" id="search-input" class="search-input" placeholder="Cari laundry, cuci sepatu, home cleaning...">
      <button id="btn-my-location" class="btn btn-primary">📍 Lokasi Saya</button>
    </div>
    
    <div class="category-bar">
      <button class="chip active" data-cat="Semua">Semua</button>
      <button class="chip" data-cat="Laundry Kiloan" data-slug="laundry">Laundry Kiloan</button>
      <button class="chip" data-cat="Laundry Satuan" data-slug="laundry">Laundry Satuan</button>
      <button class="chip" data-cat="Laundry Express" data-slug="laundry">Laundry Express</button>
      <button class="chip" data-cat="Cuci Sepatu" data-slug="cuci-sepatu">Cuci Sepatu</button>
      <button class="chip" data-cat="Cuci Sofa" data-slug="cuci-sofa">Cuci Sofa</button>
      <button class="chip" data-cat="Cuci Kasur" data-slug="cuci-kasur">Cuci Kasur</button>
      <button class="chip" data-cat="Cuci Karpet" data-slug="cuci-karpet">Cuci Karpet</button>
      <button class="chip" data-cat="Home Cleaning" data-slug="home-cleaning">Home Cleaning</button>
      <button class="chip" data-cat="Office Cleaning" data-slug="office-cleaning">Office Cleaning</button>
      <button class="chip" data-cat="Cleaning Service" data-slug="cleaning-service">Cleaning Service</button>
      <button class="chip" data-cat="Car Wash" data-slug="car-wash">Car Wash</button>
      <button class="chip" data-cat="Jasa Cleaning Lainnya" data-slug="cleaning">Lainnya</button>
    </div>
  </section>

  <main class="main-container">
    <section class="list-container" id="business-list"></section>
    <section id="map"></section>
  </main>

  <div class="toast" id="toast"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script type="module">
    import { fetchActiveBusinesses, calculateDistance } from './js/business.js';
    import { initMap, updateMapMarkers, setMapCenter } from './js/map.js';

    let allBusinesses = [];
    let userLocation = null;
    let currentCategory = "Semua";

    document.addEventListener("DOMContentLoaded", async () => {
      initMap("map");
      setupEventListeners();
      await loadData();
    });

    async function loadData() {
      const listEl = document.getElementById("business-list");
      listEl.innerHTML = `<div class="loading-state">Memuat data Laundry Directory...</div>`;
      try {
        allBusinesses = await fetchActiveBusinesses();
        applyFilters();
      } catch (err) {
        listEl.innerHTML = `<div class="empty-state">Gagal memuat data dari database.</div>`;
      }
    }

    function applyFilters() {
      const kw = document.getElementById("search-input").value.toLowerCase().trim();
      const filtered = allBusinesses.filter(b => {
        const matchCat = currentCategory === "Semua" || b.category === currentCategory;
        const target = `${b.name} ${b.category} ${b.address} ${b.city} ${b.province}`.toLowerCase();
        return matchCat && (!kw || target.includes(kw));
      });

      renderList(filtered);
      updateMapMarkers(filtered);
    }

    function renderList(businesses) {
      const listEl = document.getElementById("business-list");
      listEl.innerHTML = "";

      if (businesses.length === 0) {
        listEl.innerHTML = `<div class="empty-state"><p>Usaha tidak ditemukan.</p></div>`;
        return;
      }

      businesses.forEach(b => {
        let distText = "";
        if (userLocation && b.latitude && b.longitude) {
          distText = ` 📏 ${calculateDistance(userLocation.lat, userLocation.lng, b.latitude, b.longitude)} km`;
        }

        const detailUrl = `/${b.categorySlug || 'laundry'}/${b.citySlug || 'lokasi'}/${b.slug}`;

        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `
          <div style="display:flex; justify-content:space-between; align-items:flex-start;">
            <a href="${detailUrl}" class="card-title" style="text-decoration:none;">${b.name}</a>
            <span class="badge">${b.category}</span>
          </div>
          <div class="card-info">📍 ${b.city || b.address || '-'} ${distText}</div>
          <a href="${detailUrl}" class="btn btn-secondary" style="margin-top:0.4rem; font-size:0.75rem;">Lihat Detail & Map</a>
        `;
        listEl.appendChild(card);
      });
    }

    function setupEventListeners() {
      document.getElementById("search-input").addEventListener("input", applyFilters);
      document.querySelectorAll(".chip").forEach(chip => {
        chip.onclick = (e) => {
          document.querySelectorAll(".chip").forEach(c => c.classList.remove("active"));
          e.target.classList.add("active");
          currentCategory = e.target.dataset.cat;
          applyFilters();
        };
      });

      document.getElementById("btn-my-location").onclick = () => {
        if (!navigator.geolocation) return alert("Browser tidak mendukung lokasi.");
        navigator.geolocation.getCurrentPosition(
          (pos) => {
            userLocation = { lat: pos.coords.latitude, lng: pos.coords.longitude };
            setMapCenter(userLocation.lat, userLocation.lng);
            applyFilters();
          },
          () => alert("Lokasi Anda tidak dapat diakses. Anda dapat mencari berdasarkan kota atau peta manual.")
        );
      };
    }
  </script>
</body>
</html>
