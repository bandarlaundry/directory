<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Laundry Directory — Cari Laundry & Cleaning Terdekat</title>
  <meta name="description" content="Temukan laundry, cuci sepatu, home cleaning, cuci sofa, cuci karpet, dan berbagai jasa cleaning berdasarkan lokasi Anda.">
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="./css/style.css">
  <style>
    #map {
      width: 100% !important;
      height: 400px !important;
      min-height: 350px !important;
      display: block !important;
      background-color: #cbd5e1 !important;
      z-index: 1;
    }
    @media (min-width: 768px) {
      .main-container {
        display: flex !important;
        flex-direction: row !important;
        height: calc(100vh - 160px) !important;
      }
      #map {
        height: 100% !important;
      }
    }
  </style>
</head>
<body>

  <header class="app-header">
    <div class="brand">
      <h1><a href="./">Laundry Directory V1.0</a></h1>
      <p>Temukan laundry & jasa cleaning terdekat.</p>
    </div>
    <a href="./admin.html" class="btn btn-secondary">🛠️ Admin</a>
  </header>

  <section class="controls-section">
    <div class="search-wrapper">
      <input type="text" id="search-input" class="search-input" placeholder="Cari laundry, cuci sepatu, home cleaning...">
      <button id="btn-my-location" class="btn btn-primary">📍 Lokasi Saya</button>
    </div>
    
    <div class="category-bar">
      <button class="chip active" data-cat="Semua">Semua</button>
      <button class="chip" data-cat="Laundry Kiloan">Laundry Kiloan</button>
      <button class="chip" data-cat="Laundry Satuan">Laundry Satuan</button>
      <button class="chip" data-cat="Laundry Express">Laundry Express</button>
      <button class="chip" data-cat="Cuci Sepatu">Cuci Sepatu</button>
      <button class="chip" data-cat="Cuci Sofa">Cuci Sofa</button>
      <button class="chip" data-cat="Cuci Kasur">Cuci Kasur</button>
      <button class="chip" data-cat="Cuci Karpet">Cuci Karpet</button>
      <button class="chip" data-cat="Home Cleaning">Home Cleaning</button>
      <button class="chip" data-cat="Office Cleaning">Office Cleaning</button>
      <button class="chip" data-cat="Cleaning Service">Cleaning Service</button>
      <button class="chip" data-cat="Car Wash">Car Wash</button>
      <button class="chip" data-cat="Jasa Cleaning Lainnya">Lainnya</button>
    </div>
  </section>

  <main class="main-container">
    <section class="list-container" id="business-list">
      <div class="loading-state">Memuat data dari database...</div>
    </section>
    <section id="map"></section>
  </main>

  <div class="toast" id="toast"></div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Module Script -->
  <script type="module">
    import { fetchActiveBusinesses, calculateDistance, getBasePath } from './js/business.js';
    import { initMap, updateMapMarkers, setMapCenter } from './js/map.js';

    let allBusinesses = [];
    let userLocation = null;
    let currentCategory = "Semua";

   document.addEventListener("DOMContentLoaded", async () => {
  // 1. Inisialisasi Peta
  try {
    initMap("map");
  } catch (err) {
    console.error("Gagal inisialisasi peta Leaflet:", err);
  }

  // 2. PAKSA LEAFLET MENGHITUNG ULANG UKURAN KANVAS
  setTimeout(() => {
    window.dispatchEvent(new Event('resize'));
  }, 500);

  setupEventListeners();

  // 3. Ambil data bisnis dari Firebase Firestore
  await loadData();
});

    async function loadData() {
      const listEl = document.getElementById("business-list");

      // Menyiapkan timeout 8 detik agar UI tidak gantung jika koneksi gantung
      const timeoutPromise = new Promise((_, reject) =>
        setTimeout(() => reject(new Error("Koneksi ke Firestore mengalami batas waktu (timeout).")), 8000)
      );

      try {
        allBusinesses = await Promise.race([fetchActiveBusinesses(), timeoutPromise]);
        applyFilters();
      } catch (err) {
        console.error("Firebase fetch error:", err);
        listEl.innerHTML = `
          <div class="empty-state">
            <p><strong>Gagal memuat data dari database.</strong></p>
            <p><small>${err.message || 'Periksa aturan Firestore atau jaringan Anda.'}</small></p>
            <button class="btn btn-primary" onclick="location.reload()" style="margin-top:10px;">Coba Lagi</button>
          </div>
        `;
      }
    }

    function applyFilters() {
      const kw = document.getElementById("search-input").value.toLowerCase().trim();
      const filtered = allBusinesses.filter(b => {
        const matchCat = currentCategory === "Semua" || b.category === currentCategory;
        const target = `${b.name} ${b.category} ${b.address} ${b.city} ${b.province}`.toLowerCase();
        return matchCat && (!kw || target.includes(kw));
      });

      renderList(filtered);
      
      // Render marker pin di peta Leaflet
      updateMapMarkers(filtered);
    }

    function renderList(businesses) {
      const listEl = document.getElementById("business-list");
      listEl.innerHTML = "";
      const basePath = getBasePath();

      if (businesses.length === 0) {
        listEl.innerHTML = `<div class="empty-state"><p>Tidak ada data usaha ditemukan.</p></div>`;
        return;
      }

      businesses.forEach(b => {
        let distText = "";
        if (userLocation && b.latitude && b.longitude) {
          distText = ` 📏 ${calculateDistance(userLocation.lat, userLocation.lng, b.latitude, b.longitude)} km`;
        }

        const detailUrl = `${basePath}/${b.categorySlug || 'laundry'}/${b.citySlug || 'lokasi'}/${b.slug}`;

        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `
          <div style="display:flex; justify-content:space-between; align-items:flex-start;">
            <a href="${detailUrl}" class="card-title" style="text-decoration:none;">${b.name}</a>
            <span class="badge">${b.category}</span>
          </div>
          <div class="card-info">📍 ${b.city || b.address || '-'} ${distText}</div>
          <a href="${detailUrl}" class="btn btn-secondary" style="margin-top:0.4rem; font-size:0.75rem;">Lihat Detail & Map</a>
        `;
        listEl.appendChild(card);
      });
    }

    function setupEventListeners() {
      // Pencarian kata kunci
      document.getElementById("search-input").addEventListener("input", applyFilters);

      // Filter kategori
      document.querySelectorAll(".chip").forEach(chip => {
        chip.onclick = (e) => {
          document.querySelectorAll(".chip").forEach(c => c.classList.remove("active"));
          e.target.classList.add("active");
          currentCategory = e.target.dataset.cat;
          applyFilters();
        };
      });

      // Deteksi lokasi pengguna
      document.getElementById("btn-my-location").onclick = () => {
        if (!navigator.geolocation) {
          alert("Browser Anda tidak mendukung fitur Geolocation.");
          return;
        }
        navigator.geolocation.getCurrentPosition(
          (pos) => {
            userLocation = { lat: pos.coords.latitude, lng: pos.coords.longitude };
            setMapCenter(userLocation.lat, userLocation.lng, 14);
            applyFilters();
          },
          () => alert("Akses lokasi ditolak atau tidak dapat ditemukan. Anda tetap dapat menggunakan peta secara manual.")
        );
      };
    }
  </script>
</body>
</html>
